services:
  bd:
    image: mysql:8.0
    container_name: xuxemon-bd
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: xuxemon
      MYSQL_USER: xuxemon_user
      MYSQL_PASSWORD: xuxemon_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./Backend/Xuxemon_Bknd
    container_name: xuxemon-backend
    ports:
      - "8000:80"
    depends_on:
      bd:
        condition: service_healthy
    env_file:
      - ./Backend/Xuxemon_Bknd/.env.docker
    volumes:
      - ./Backend/Xuxemon_Bknd:/var/www/html

  frontend:
    build:
      context: ./Frontend/xuxemons
      dockerfile: Dockerfile.dev
    container_name: xuxemon-frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend
    volumes:
      - ./Frontend/xuxemons:/app
      - /app/node_modules

volumes:
  mysql-data:
