<app-loading-spinner [visible]="(loading$ | async) ?? false"></app-loading-spinner>

<a class="skip-link" href="#main-content">Saltar al contenido principal</a>

<router-outlet />

@if (showReward) {
<div class="reward-overlay" (click)="$event.stopPropagation()">
    <div class="reward-card" role="dialog" aria-modal="true" aria-labelledby="reward-title" aria-describedby="reward-desc">
        <div class="reward-icon" aria-hidden="true">🎁</div>
        <h2 id="reward-title">Recompensa diaria</h2>
        <p id="reward-desc" class="reward-desc">Tienes un regalo esperándote</p>
        <div class="reward-items">
            <div class="reward-item">
                <span class="reward-emoji" aria-hidden="true">🍬</span>
                <span>{{ rewardXuxesAmount }} Xuxes</span>
            </div>
            <div class="reward-item">
                <span class="reward-emoji" aria-hidden="true">🐾</span>
                <span>1 Xuxemon</span>
            </div>
        </div>
        <button (click)="claim()" class="reward-button">Reclamar</button>
    </div>
</div>
}
