@if (isFriendsRoute) {
<div class="dashboard-layout">
    <aside class="sidebar">
        <div class="logo-container">
            <img src="/imagenes/avatar-figma.png" alt="Logo de Xuxemons" class="logo-mini">
        </div>

        <nav aria-label="Navegacion principal">
            <ul class="nav-list">
                <li><a routerLink="/home" class="nav-link">INICIO</a></li>
                <li><a routerLink="/xuxedex" class="nav-link">XUXEDEX</a></li>
                <li><a routerLink="/mochila" class="nav-link">MOCHILA</a></li>
                <li><a routerLink="/friends" class="nav-link active" aria-current="page">AMIGOS</a></li>
                <li><a routerLink="/perfil" class="nav-link">PERFIL</a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <header class="home-header">
            <div class="greeting">
                <h1>Hola, entrenador</h1>
            </div>
            <div class="stats-badge" aria-label="Estadisticas del jugador">
                <span class="stat"><strong>Nivel:</strong> 1</span>
                <span class="stat"><strong>Monedas:</strong> 1500</span>
            </div>
        </header>

        <router-outlet />
    </main>
</div>
} @else {
<router-outlet />
}

<!-- notificacion de recompensa -->
@if (showReward) {
<div
    style="position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 9999;">
    <div
        style="background: white; padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 0 20px #ffcc00; animation: jump 0.5s infinite alternate;">
        <h2 style="margin-top: 0;">¡tienes una recompensa diaria!</h2>
        <p>5 xuxes te estan esperando</p>
        <button (click)="claim()"
            style="padding: 10px 20px; background: #ffcc00; border: none; border-radius: 10px; cursor: pointer; font-weight: bold;">reclamar
            ya</button>
    </div>
</div>
}

<style>
    @keyframes jump {
        from {
            transform: translateY(0);
        }

        to {
            transform: translateY(-10px);
        }
    }
</style>
