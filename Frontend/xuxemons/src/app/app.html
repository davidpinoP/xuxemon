<app-loading-spinner [visible]="(loading$ | async) ?? false"></app-loading-spinner>

<a class="skip-link" href="#main-content">Saltar al contingut principal</a>

<router-outlet />

@if (showReward) {
<div class="reward-overlay" (click)="$event.stopPropagation()">
    <div class="reward-card">
        <div class="reward-icon">🎁</div>
        <h2>Recompensa diaria</h2>
        <p class="reward-desc">Tienes un regalo esperándote</p>
        <div class="reward-items">
            <div class="reward-item">
                <span class="reward-emoji">🍬</span>
                <span>{{ rewardXuxesAmount }} Xuxes</span>
            </div>
            <div class="reward-item">
                <span class="reward-emoji">🐾</span>
                <span>1 Xuxemon</span>
            </div>
        </div>
        <button (click)="claim()" class="reward-button">Reclamar</button>
    </div>
</div>
}
