<div class="app-layout">
  <app-sidebar></app-sidebar>

  <main class="main-content">
    <header class="page-header">
      <h1 class="page-title">Panel de Control Admin</h1>
    </header>

    <!-- parametros -->
    <section class="admin-settings-section" aria-labelledby="settings-title">
      <h2 id="settings-title" class="sr-only">Ajustes globales</h2>
      <fieldset style="border: 1px solid #ccc; padding: 10px; margin-bottom: 20px; border-radius: 8px;">
        <legend style="font-weight: bold; padding: 0 10px; font-variant: small-caps;">ajustes globales</legend>
        <form [formGroup]="fConfig" (ngSubmit)="saveConf()">
          <p>% infeccion: <input type="number" formControlName="infection_pct"></p>
          <p>xuxes para evolucion: <input type="number" formControlName="evolve_xuxes"></p>
          <p>hora recompensa: <input type="number" formControlName="reward_hour"></p>
          <button type="submit" style="cursor: pointer;">guardar ajustes</button>
        </form>
      </fieldset>
    </section>

    <!-- jugadores -->
    <section class="players-list-section" aria-labelledby="players-title">
      <h2 id="players-title" class="sr-only">Lista de jugadores</h2>
      <fieldset style="border: 1px solid #ccc; padding: 10px; border-radius: 8px;">
        <legend style="font-weight: bold; padding: 0 10px; font-variant: small-caps;">lista de jugadores</legend>
        <div class="users-table-wrapper">
          <table border="1" style="width: 100%; border-collapse: collapse;">
            <tr style="background-color: #f2f2f2;">
              <th>id</th>
              <th>nombre</th>
              <th>accion</th>
            </tr>
            @for (u of users; track u.id) {
            <tr style="text-align: center;">
              <td>{{ u.player_id }}</td>
              <td>{{ u.name }}</td>
              <td>
                <input #vacName type="text" placeholder="nombre vacuna">
                <button (click)="vacuna(u.id, vacName.value)" style="cursor: pointer;">dar vacuna</button>
              </td>
            </tr>
            }
          </table>
        </div>
      </fieldset>
    </section>
  </main>

</div>
