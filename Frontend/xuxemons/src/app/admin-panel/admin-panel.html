<div class="app-layout">
  <app-sidebar></app-sidebar>

  <main id="main-content" tabindex="-1" class="main-content">
    <h1 class="page-title">Panel de Control Admin</h1>

    <fieldset class="admin-box">
      <legend>Ajustes globales</legend>
      <form [formGroup]="fConfig" (ngSubmit)="saveConf()" class="admin-form">
        <label>
          <span>% Bajón de azúcar</span>
          <input class="form-control" type="number" formControlName="pct_bajon_azucar" min="0" max="100">
        </label>
        <label>
          <span>% Sobredosis de sucre</span>
          <input class="form-control" type="number" formControlName="pct_sobredosis_sucre" min="0" max="100">
        </label>
        <label>
          <span>% Atracón</span>
          <input class="form-control" type="number" formControlName="pct_atracon" min="0" max="100">
        </label>
        <label>
          <span>Xuxes para evolucion</span>
          <input class="form-control" type="number" formControlName="evolve_xuxes">
        </label>
        <label>
          <span>Hora recompensa</span>
          <input class="form-control" type="number" formControlName="reward_hour" min="0" max="23">
        </label>
        <label>
          <span>Xuxes diarios</span>
          <input class="form-control" type="number" formControlName="reward_xuxes_amount" min="1">
        </label>
        <button class="btn btn-primary" type="submit">Guardar ajustes</button>
      </form>
    </fieldset>

    @if (mensajeRegalo) {
    <p class="gift-message" role="status" aria-live="polite">{{ mensajeRegalo }}</p>
    }

    <fieldset class="admin-box">
      <legend>Lista de jugadores</legend>
      <table class="table table-striped table-hover align-middle users-table">
        <thead>
          <tr>
            <th>Player ID</th>
            <th>Nombre</th>
            <th>Estado</th>
            <th>Vacuna</th>
            <th>Regalo Xuxemon</th>
          </tr>
        </thead>
        <tbody>
          @for (u of users; track u.id) {
          <tr [class.user-inactive]="!u.is_active">
            <td>{{ u.player_id }}</td>
            <td>{{ u.name }}</td>
            <td>
              <button
                class="btn-toggle-user"
                [class.btn-restore]="!u.is_active"
                [class.btn-deactivate]="u.is_active && u.role !== 'admin'"
                (click)="toggleUser(u)"
                [disabled]="u.role === 'admin'"
                type="button">
                {{ u.is_active ? (u.role === 'admin' ? '🔒 Admin' : '✅ Activo') : '🔴 Inactivo' }}
              </button>
            </td>
            <td>
              <div class="action-cell">
                <select class="form-select" #vacName>
                  <option value="Xocolatina">🍫 Xocolatina</option>
                  <option value="Xal de fruites">🍬 Xal de fruites</option>
                  <option value="Inxulina">🍭 Inxulina (cura todo)</option>
                </select>
                <button class="btn btn-outline-primary" (click)="vacuna(u.id, vacName.value)" type="button">Dar vacuna</button>
              </div>
            </td>
            <td>
              <div class="action-cell">
                <button class="gift-btn btn btn-outline-secondary" (click)="darXuxemonAleatorio(u.id)" type="button"
                  [disabled]="regalandoXuxemonUserId === u.id">
                  @if (regalandoXuxemonUserId === u.id) {
                  Regalando...
                  } @else {
                  Dar Xuxemon aleatorio
                  }
                </button>
              </div>
            </td>
          </tr>
          }
        </tbody>
      </table>
    </fieldset>
  </main>
</div>
