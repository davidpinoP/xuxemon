<div class="app-layout">
  <app-sidebar></app-sidebar>

  <main class="main-content">
    <h1 class="page-title">Panel de Control Admin</h1>

    <fieldset class="admin-box">
      <legend>Ajustes globales</legend>
      <form [formGroup]="fConfig" (ngSubmit)="saveConf()" class="admin-form">
        <label>
          <span>% infeccion</span>
          <input type="number" formControlName="infection_pct">
        </label>
        <label>
          <span>Xuxes para evolucion</span>
          <input type="number" formControlName="evolve_xuxes">
        </label>
        <label>
          <span>Hora recompensa</span>
          <input type="number" formControlName="reward_hour">
        </label>
        <button type="submit">Guardar ajustes</button>
      </form>
    </fieldset>

    @if (mensajeRegalo) {
    <p class="gift-message" role="status" aria-live="polite">{{ mensajeRegalo }}</p>
    }

    <fieldset class="admin-box">
      <legend>Lista de jugadores</legend>
      <table class="users-table">
        <thead>
          <tr>
            <th>Player ID</th>
            <th>Nombre</th>
            <th>Vacuna</th>
            <th>Regalo Xuxemon</th>
          </tr>
        </thead>
        <tbody>
          @for (u of users; track u.id) {
          <tr>
            <td>{{ u.player_id }}</td>
            <td>{{ u.name }}</td>
            <td class="action-cell">
              <input #vacName type="text" placeholder="Nombre vacuna">
              <button (click)="vacuna(u.id, vacName.value)" type="button">Dar vacuna</button>
            </td>
            <td class="action-cell">
              <button class="gift-btn" (click)="darXuxemonAleatorio(u.id)" type="button"
                [disabled]="regalandoXuxemonUserId === u.id">
                @if (regalandoXuxemonUserId === u.id) {
                Regalando...
                } @else {
                Dar Xuxemon aleatorio
                }
              </button>
            </td>
          </tr>
          }
        </tbody>
      </table>
    </fieldset>
  </main>
</div>
