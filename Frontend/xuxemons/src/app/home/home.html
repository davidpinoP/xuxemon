<div class="app-layout">
  <app-sidebar></app-sidebar>

  <main class="main-content">
    <header class="home-header">
      <div class="greeting">
        <h1 class="page-title">Hola, {{ user?.name || 'entrenador' }}</h1>
      </div>
      <div class="stats-badge" aria-label="Estadísticas del jugador">
        <span class="stat"><strong>Nivel:</strong> 1</span>
        <span class="stat"><strong>Monedas:</strong> 1500</span>
      </div>
    </header>

    <section class="team-section" aria-labelledby="team-heading">
      <h2 id="team-heading">Mi Equipo Principal</h2>

      <div class="team-grid">
        @for (xuxemon of equipo; track xuxemon.id) {
        <article class="xuxemon-card" tabindex="0">
          <img [src]="xuxemon.imagen" [alt]="'Xuxemon ' + xuxemon.nombre" class="xuxemon-img">
          <h3>{{ xuxemon.nombre }}</h3>
        </article>
        }
      </div>
    </section>

  </main>
</div>
